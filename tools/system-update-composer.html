<!-- כלי פנימי: בונה בלוק <article> תקין להדבקה ישירה בתוך content/system-updates.he.html.
     לא חלק מהאפליקציה החיה - כלי עזר בלבד, לא נטען ע"י index.html. -->
<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>כלי הרכבת עדכון מערכת - COT</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
<style>
  :root { --navy:#16233B; --blue:#1D4E89; --amber:#B06F1F; --line:#DCE3EC; --ground:#F2F5F9; --ink:#253246; --muted:#64748B; }
  body { font-family:'Heebo',sans-serif; background:var(--ground); color:var(--ink); margin:0; padding:30px 16px; }
  .wrap { max-width:640px; margin:0 auto; }
  h1 { color:var(--navy); font-size:21px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 24px; }
  .card { background:#fff; border-radius:16px; box-shadow:0 2px 10px rgba(20,33,58,.06); padding:24px; margin-bottom:24px; }
  label { display:block; font-size:13px; font-weight:700; color:var(--navy); margin:14px 0 5px; }
  label:first-child { margin-top:0; }
  input[type=text], input[type=date], textarea { width:100%; box-sizing:border-box; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; font-family:inherit; font-size:14px; color:var(--ink); background:var(--ground); }
  textarea { resize:vertical; min-height:70px; }
  .row { display:flex; gap:14px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:150px; }
  .pin-row { display:flex; align-items:center; gap:8px; margin-top:16px; }
  .pin-row input { width:auto; }
  .pin-row label { margin:0; font-weight:600; font-size:13.5px; }
  button { background:var(--blue); color:#fff; border:none; padding:12px 26px; border-radius:10px; font-weight:700; font-size:14.5px; cursor:pointer; margin-top:18px; }
  button:hover { background:#163C6C; }
  h2 { font-size:15px; color:var(--navy); margin:0 0 10px; }
  pre { background:var(--navy); color:#D9E4F5; padding:16px; border-radius:10px; font-size:12.5px; overflow-x:auto; white-space:pre-wrap; word-break:break-word; direction:ltr; text-align:left; }
  .copy-btn { background:var(--amber); margin-top:10px; }
  .copy-btn:hover { background:#96590F; }
  .preview { margin-top:16px; }
  .note { font-size:12px; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>כלי הרכבת עדכון מערכת</h1>
  <p class="sub">ממלאים את הטופס, מעתיקים את הפלט, ומדביקים אותו בתוך <code>content/system-updates.he.html</code> (בין &lt;article&gt; קיימים, או בתחילת/סוף הקובץ).</p>

  <div class="card">
    <label for="title">כותרת ההודעה</label>
    <input type="text" id="title" placeholder="למשל: תיקון חישוב בערבי חג">

    <label for="text">תוכן ההודעה</label>
    <textarea id="text" placeholder="משפט או שניים שמסבירים למשתמש מה השתנה ולמה זה חשוב לו"></textarea>

    <div class="row">
      <div>
        <label for="date">תאריך פרסום</label>
        <input type="date" id="date">
      </div>
      <div>
        <label for="expires">תאריך תפוגה (יורד מהרשימה אחריו)</label>
        <input type="date" id="expires">
      </div>
    </div>
    <div class="note">מומלץ: חודש-חודש וחצי לעדכון רגיל; לדברים דחופים (כמו תאריך יעד) - עד אחרי התאריך הרלוונטי.</div>

    <div class="pin-row">
      <input type="checkbox" id="pinned">
      <label for="pinned">הצמד למעלה (לדברים דחופים/חשובים במיוחד - לכל היותר הודעה מוצמדת אחת פעילה בו-זמנית)</label>
    </div>

    <button onclick="generate()">הרכב HTML</button>
  </div>

  <div class="card preview" id="outputCard" style="display:none;">
    <h2>הדביקו את זה בתוך content/system-updates.he.html:</h2>
    <pre id="output"></pre>
    <button class="copy-btn" onclick="copyOutput()">העתק ללוח</button>
  </div>
</div>

<script>
document.getElementById('date').valueAsDate = new Date();
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function generate() {
  var title = document.getElementById('title').value.trim();
  var text = document.getElementById('text').value.trim();
  var date = document.getElementById('date').value;
  var expires = document.getElementById('expires').value;
  var pinned = document.getElementById('pinned').checked;
  if (!title || !text || !date || !expires) { alert('יש למלא כותרת, תוכן, תאריך פרסום ותאריך תפוגה.'); return; }
  if (expires < date) { alert('תאריך התפוגה לא יכול להיות לפני תאריך הפרסום.'); return; }

  var dateDisplay = new Date(date + 'T00:00:00').toLocaleDateString('he-IL', { day: 'numeric', month: 'long', year: 'numeric' });
  var cls = pinned ? 'update-card alert-highlight' : 'update-card';
  var badge = pinned ? '\n    <span class="alert-badge">חשוב</span>' : '';
  var pinAttr = pinned ? ' data-pinned="true"' : '';

  var html = '<article class="' + cls + '" data-date="' + date + '" data-expires="' + expires + '"' + pinAttr + '">' + badge + '\n' +
    '    <span class="update-date">' + dateDisplay + '</span>\n' +
    '    <div class="update-title">' + esc(title) + '</div>\n' +
    '    <p class="update-text">' + esc(text) + '</p>\n' +
    '</article>';

  document.getElementById('output').textContent = html;
  document.getElementById('outputCard').style.display = 'block';
}
function copyOutput() {
  var text = document.getElementById('output').textContent;
  navigator.clipboard.writeText(text).then(function() {
    var btn = document.querySelector('.copy-btn');
    var orig = btn.innerText; btn.innerText = 'הועתק!';
    setTimeout(function() { btn.innerText = orig; }, 1500);
  });
}
</script>
</body>
</html>
